apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-app
spec:
  replicas: 3
  revisionHistoryLimit: 5
  # A release that never becomes ready is reported as failed after this long, instead of "progressing" forever.
  progressDeadlineSeconds: 45
  selector:
    matchLabels:
      app.kubernetes.io/name: rollout-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start a new pod first, and take an old one away only when the new one is ready.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rollout-app
    spec:
      serviceAccountName: rollout-app
      automountServiceAccountToken: false
      # Longer than DRAIN_SECONDS, or the kubelet kills the pod in the middle of draining.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: rollout-lab:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DRAIN_SECONDS
              value: "5"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
