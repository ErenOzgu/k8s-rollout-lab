name: Release

on:
  push:
    tags: ["v*"]
    # A commit that adds a new version heading to CHANGELOG.md releases that version. The tag is made by this
    # workflow, not pushed by a person; a commit that only adds to "Unreleased" does nothing.
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create from the selected commit, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Which version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide the tag, and whether it still needs a release
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${REF_NAME}"
          else
            # A push to main that touched CHANGELOG.md: the newest numbered heading is the version to release.
            number=$(sed -nE 's/^## \[?v?([0-9]+\.[0-9]+\.[0-9]+)\]?.*/\1/p' CHANGELOG.md | head -1)
            tag="v${number}"
            if [[ -z "${number}" ]]; then
              echo "No numbered heading in CHANGELOG.md; nothing to release."
              echo "release=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "${tag} is already released; nothing to do."
              echo "release=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'${tag}' is not a vX.Y.Z tag"; exit 1; }
          echo "Releasing ${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release=true" >> "${GITHUB_OUTPUT}"

  release:
    name: Test and GitHub release
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_app.py' -v
      - name: Render the manifests of this release
        run: |
          set -euo pipefail
          mkdir dist
          kubectl kustomize k8s/overlays/dev > dist/rollout-lab-dev.yaml
          kubectl kustomize k8s/overlays/prod > dist/rollout-lab-prod.yaml
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" dist/* \
            --target "${GITHUB_SHA}" --title "${VERSION}" --generate-notes
