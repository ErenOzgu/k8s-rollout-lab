name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create from the selected commit, e.g. v0.1.0"
        required: true
        type: string

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: Test and GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check version format
        run: |
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'${VERSION}' is not a vX.Y.Z tag"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_app.py' -v
      - name: Render the manifests of this release
        run: |
          set -euo pipefail
          mkdir dist
          kubectl kustomize k8s/overlays/dev > dist/rollout-lab-dev.yaml
          kubectl kustomize k8s/overlays/prod > dist/rollout-lab-prod.yaml
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" dist/* \
            --target "${GITHUB_SHA}" --title "${VERSION}" --generate-notes
